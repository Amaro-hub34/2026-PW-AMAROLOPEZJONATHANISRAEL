<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Registrar Asistencia - CECyT 9</title>
  <link rel="stylesheet" href="./CSS/style.css">

</head>
<body>
  <header>
    <a href="./detalle.html" id="link-registro">Volver al Taller</a>
  </header>
  <main>
    <form class="formulario-registro">
      <h1 class="titulo-formulario">Registrar Asistencia</h1>
      <label for="nombre">Nombre:</label>
      <input type="text" id="nombre" name="nombre" required></input>
      <label for="boleta">Número de Boleta:</label>
      <input type="text" id="boleta" name="boleta" required>
      <button type="submit" id="boton-registrar">Registrar</button>
    </form>
  </main>
</body>
</html>
